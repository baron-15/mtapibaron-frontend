<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JFK airport icon preview</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: #171717; color: white; display: block; }
  h1, p { margin: 1rem 4vw; font: 16px Arial, sans-serif; }
  .block { margin: 1rem auto; }
  .footer { display: none; }
  .reference { width: 100px; height: 100px; margin: 0 4vw; }
</style>
<h1>JFK airport icon — actual V2 renderer</h1>
<div class="block"><div class="train" id="examples"></div></div>
<p>The airplane appears directly before each standalone JFK in secondary text only. Last row checks a primary-only JFK.</p>
<img class="reference" src="../icons/airport-jfk.svg" alt="Airport icon detail">
<div class="footer"><select id="routeSelect"></select><select id="stopSelect"></select></div>
<script>window.fetch = () => new Promise(() => {});</script>
<script src="../javascript.js"></script>
<script>
  const examples = [
    ['E', 'Uptown & Queens', 'Jamaica Center/JFK', false],
    ['J', 'Jamaica Center', 'JFK', false],
    ['A', 'Queens', 'Far Rockaway-Mott Av/JFK', false],
    ['E', 'Uptown & Queens', 'Jamaica Center/JFK via Roosevelt Island', true],
    ['A', 'Howard Beach-JFK Airport', null, false]
  ];
  examples.forEach(([route, terminalPrimary, terminalSecondary, arriving], index) => {
    const row = document.createElement('div');
    row.className = 'trainrow v2' + (arriving ? ' arrival-invert' : '');
    row.innerHTML = `<div class="num">${index + 1}</div><div class="route circle" style="background:${routeBackgroundColors[route]};color:white"><div class="routeText">${route}</div></div><div class="terminal"></div><div class="eta"><span class="eta-number">${index + 1}</span><span class="eta-unit">MIN</span></div>`;
    renderV2Destination(row.querySelector('.terminal'), { terminalPrimary, terminalSecondary });
    document.getElementById('examples').appendChild(row);
  });
</script>
</html>
