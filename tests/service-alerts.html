<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service alerts preview</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: #171717; color: white; }
  .preview-controls { margin: 1rem 4vw; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
  .preview-controls label { font-size: 14px; }
  .block { margin-top: 2rem; }
  #allRoutes { display: none; }
</style>
<div class="preview-controls">
  <span>Station response preview</span>
  <label>Alert source <select id="previewSource" onchange="setPreviewSource(this.value)">
    <option value="sample">Sample station response</option>
    <option value="live">Live local station API</option>
    <option value="empty">No alerts</option>
    <option value="error">Unavailable</option>
  </select></label>
  <button onclick="showFooter()">Show footer settings</button>
</div>
<div class="block">
  <div class="station" id="stationBlock">
    <div id="stationName">42 St-Bryant Pk Station</div>
    <div id="allRoutes"></div>
  </div>
  <div class="train" id="trainBlock"></div>
  <section class="service-alerts" id="serviceAlertsBlock" aria-labelledby="serviceAlertsTitle">
    <header class="service-alerts-heading">
      <div class="service-alerts-title">
        <h2 id="serviceAlertsTitle">Happening now</h2>
        <span class="service-alerts-counter" id="serviceAlertsCounter"></span>
      </div>
      <div class="service-alerts-links">
        <a href="https://www.mta.info/alerts" target="_blank" rel="noopener noreferrer">Visit mta.info for more</a>
      </div>
    </header>
    <p class="service-alerts-status" id="serviceAlertsStatus" role="status">Waiting for station arrivals…</p>
    <div class="service-alert-pages" id="serviceAlertPages"></div>
  </section>
</div>
<div class="footer">
  <div class="forms">
    <select id="routeSelect" hidden></select><select id="stopSelect" hidden></select>
    <label>Rows <select id="noOfTrainsEntry" onchange="updateTrainCount()"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label>
    <label>Display <select id="displayVersion" onchange="updateDisplayVersion()"><option>v1</option><option selected>v2</option></select></label>
    <label>Display station block <input type="checkbox" id="toggleStationBlock" onchange="toggleStationBlock()" checked></label>
    <label>Display service alerts <input type="checkbox" id="toggleServiceAlerts" onchange="toggleServiceAlerts()" checked></label>
    <button onclick="toggleRouteFilter('F')">Toggle F filter</button>
  </div>
  <div class="misc" id="datetime"></div>
</div>
<script>
  const liveFetch = window.fetch.bind(window);
  let alertSource = new URLSearchParams(location.search).get('source') === 'live' ? 'live' : 'sample';
  document.getElementById('previewSource').value = alertSource;
  function sampleStationResponse() {
    const now = Date.now();
    const alerts = [
      ['delay-b', 'B', 'Delays', 'Northbound [B] trains are running with delays after we moved a train with a door problem at 86 St.', 15],
      ['lmm:planned_work:f', 'F', 'Planned - Reroute', 'Queens-bound [F] trains are running via the [E] line between 47-50 Sts-Rockefeller Ctr and Jackson Hts-Roosevelt Av.', 60],
      ['lmm:planned_work:d', 'D', 'Planned - Stops Skipped', 'Uptown [D] trains skip 155 St while we replace tracks.', 120]
    ].map(([id, route, type, text, minutes]) => ({
      id, routes: [route], stationWide: false, type, text, planned: id.includes('planned_work'),
      updatedAt: now / 1000 - minutes * 60, activeUntil: null, schedule: ''
    }));
    const alltrains = [
      ['B', 'Uptown', '145 St', 'D13N', 1],
      ['F', 'Uptown', 'Jamaica-179 St', 'F01N', 4],
      ['D', 'Downtown', 'Coney Island-Stillwell Av', 'D43S', 5],
      ['F', 'Uptown', 'Jamaica-179 St', 'F01N', 9]
    ].map(([route, directionLabel, terminalName, terminal, minutes]) => ({
      route, directionLabel, terminalName, terminal, time: new Date(now + minutes * 60000).toISOString()
    }));
    return { updated: new Date(now).toISOString(), data: [{
      stationName: '42 St-Bryant Pk', stops: { D16: {} }, routes: ['B', 'D', 'F'], alltrains,
      serviceAlerts: { status: alertSource === 'error' ? 'unavailable' : 'ok', updatedAt: now / 1000 - 1800,
        expiresAt: now / 1000 + 300, alerts: ['empty', 'error'].includes(alertSource) ? [] : alerts }
    }] };
  }
  window.fetch = async (url, options) => {
    // Exercise the actual station response path, including its alert payload.
    if (!String(url).includes('/by-id/')) return new Promise(() => {});
    if (alertSource === 'live') return liveFetch('http://127.0.0.1:5001/by-id/D16', options);
    return { ok: true, json: async () => sampleStationResponse() };
  };
</script>
<script src="../service-alerts.js"></script>
<script src="../javascript.js"></script>
<script>
  saveUserSettings = () => {};
  stationId = 'D16';
  function setPreviewSource(value) {
    alertSource = value;
    loadSomeDisplay(stationId);
  }
  loadSomeDisplay(stationId);
  setInterval(() => loadSomeDisplay(stationId), 15000);
</script>
</html>
