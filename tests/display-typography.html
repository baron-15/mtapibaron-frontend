<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display typography regression preview</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { background: #171717; color: white; }
  h1, p { margin: 1rem 4vw; }
  h1 { font-size: 1rem; }
  .block { margin-top: 1rem; margin-bottom: 2rem; }
  .route { background: #ee0033; color: white; }
</style>
<h1>v1 / Original display</h1>
<div class="block"><div class="train" id="v1"></div></div>
<h1>v2 / After proportions</h1>
<div class="block">
  <div class="station" id="stationBlock">
    <div id="stationName">Times Sq-42 St Station</div>
    <div id="allRoutes">
      <div class="route circle"><div class="routeText">1</div></div>
      <div class="route circle"><div class="routeText">3</div></div>
      <div class="route diamond"><div class="routeText">7</div></div>
      <div class="route circle"><div class="routeText">R</div></div>
      <div class="route circle"><div class="routeText">W</div></div>
      <div class="route diamond dimmed"><div class="routeText">F</div></div>
    </div>
  </div>
  <div class="train" id="v2"></div>
</div>
<p>Offline preview: includes station route badges, single/two-line destinations, descenders, diamonds, two-digit minutes, and an arriving row. No audio or live data.</p>
<script>
  const examples = [
    ['1', 'Downtown', 'South Ferry', 2],
    ['3', 'Downtown & Brooklyn', 'New Lots Av', 5],
    ['7', 'Flushing-Main St', '', 12, 'diamond'],
    ['R', 'Manhattan & Queens', 'Forest Hills-71 Av', 0],
    ['5', 'Flatbush Av-Brooklyn College', '', 9]
  ];
  for (const version of ['v1', 'v2']) {
    document.getElementById(version).innerHTML = examples.map(([route, primary, secondary, minutes, shape], index) => `
      <div class="trainrow ${version} ${minutes === 0 ? (version === 'v2' ? 'arrival-invert' : 'arrivalyellow') : ''}">
        <div class="num">${index + 1}${version === 'v1' ? '.' : ''}</div>
        <div class="route ${shape || 'circle'}"><div class="routeText">${route}</div></div>
        <div class="terminal">${version === 'v1' ? secondary || primary : `<div class="terminal-primary">${primary}</div>${secondary ? `<div class="terminal-secondary">${secondary}</div>` : ''}`}</div>
        <div class="eta ${minutes === 0 && version === 'v1' ? 'blink' : ''}">${version === 'v1' ? minutes + ' Min' : `<span class="eta-number">${minutes}</span><span class="eta-unit">MIN</span>`}</div>
      </div>`).join('');
  }
</script>
</html>
